name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          cd extension
          zip -r ../canva-pptx-animations-${GITHUB_REF_NAME}.zip . -x "node_modules/*" "test/*" "package.json" "package-lock.json"
      - uses: softprops/action-gh-release@v2
        with:
          files: canva-pptx-animations-*.zip
          generate_release_notes: true
